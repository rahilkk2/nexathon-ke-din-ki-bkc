<template id="tpl-interactive-labs">
  <div class="page page-generic">
    <h1 class="page-title">Interactive Living Textbook Labs</h1>
    <p class="page-subtitle">Adjust real mathematical and physical parameters to build deep conceptual intuition.</p>

    <div class="concept-stages" style="margin-bottom:24px;">
      <button class="stage-btn active" id="tabLabFaraday">Lab 1: Faraday's Law & Electromagnetic Induction</button>
      <button class="stage-btn" id="tabLabFinance">Lab 2: Compound Interest & Capital Growth</button>
    </div>

    <!-- LAB 1: FARADAY'S LAW -->
    <div id="labFaradaySection" class="lab-container">
      <div class="lab-card">
        <div class="lab-header">
          <div>
            <h2 class="lab-title">Faraday's Law & Induced EMF Explorer</h2>
            <p class="lab-subtitle">Formula: \(\mathcal{E} = -N \frac{\Delta \Phi}{\Delta t}\) | Lenz's Law Opposition</p>
          </div>
          <button class="mini-btn" id="resetFaradayBtn">Reset Parameters</button>
        </div>

        <div class="lab-layout">
          <div class="lab-controls">
            <div class="control-group">
              <div class="control-label-row">
                <span>Coil Turns (\(N\)):</span>
                <span class="control-value" id="valCoilTurns">200 turns</span>
              </div>
              <input type="range" min="50" max="600" step="25" value="200" class="lab-slider" id="sliderTurns" />
            </div>

            <div class="control-group">
              <div class="control-label-row">
                <span>Magnet Speed (\(v\)):</span>
                <span class="control-value" id="valMagnetSpeed">4.0 m/s</span>
              </div>
              <input type="range" min="1" max="10" step="0.5" value="4.0" class="lab-slider" id="sliderSpeed" />
            </div>

            <div class="control-group">
              <div class="control-label-row">
                <span>Magnetic Field (\(B\)):</span>
                <span class="control-value" id="valMagField">0.8 Tesla</span>
              </div>
              <input type="range" min="0.2" max="2.5" step="0.1" value="0.8" class="lab-slider" id="sliderField" />
            </div>

            <div class="control-group">
              <div class="control-label-row">
                <span>Coil Area (\(A\)):</span>
                <span class="control-value" id="valCoilArea">0.05 m²</span>
              </div>
              <input type="range" min="0.01" max="0.12" step="0.01" value="0.05" class="lab-slider" id="sliderArea" />
            </div>
          </div>

          <div class="lab-visualization">
            <div class="canvas-wrap">
              <canvas id="faradayCanvas" class="lab-canvas" width="600" height="220"></canvas>
              <div class="canvas-legend">
                <span>🔴 Induced EMF Voltage Waveform \(\mathcal{E}(t)\)</span>
                <span>🔵 Magnetic Flux \(\Phi(t)\)</span>
              </div>
            </div>

            <div class="readout-grid">
              <div class="readout-box">
                <p class="readout-label">Peak Flux (\(\Phi\))</p>
                <p class="readout-val" id="readoutFlux">0.040 Wb</p>
              </div>
              <div class="readout-box">
                <p class="readout-label">Flux Delta (\(\frac{d\Phi}{dt}\))</p>
                <p class="readout-val" id="readoutRate">0.32 Wb/s</p>
              </div>
              <div class="readout-box">
                <p class="readout-label">Induced EMF (\(\mathcal{E}\))</p>
                <p class="readout-val" id="readoutEMF">64.0 V</p>
              </div>
              <div class="readout-box">
                <p class="readout-label">Induced Current (\(I\))</p>
                <p class="readout-val" id="readoutCurrent">6.40 A</p>
              </div>
            </div>
          </div>
        </div>

        <div class="concept-stages">
          <button class="stage-btn active" data-fstage="1">Stage 1: Magnet Approaches</button>
          <button class="stage-btn" data-fstage="2">Stage 2: Magnet at Coil Center</button>
          <button class="stage-btn" data-fstage="3">Stage 3: Magnet Departs</button>
        </div>
        <div class="stage-explanation" id="faradayStageExplanation">
          <strong>Stage 1 (Approaching):</strong> Magnetic flux entering the coil increases (\(\frac{d\Phi}{dt} > 0\)). By Lenz's Law, the coil induces a repulsive North pole and opposing EMF to resist the incoming magnet.
        </div>
      </div>
    </div>

    <!-- LAB 2: COMPOUND INTEREST -->
    <div id="labFinanceSection" class="lab-container" style="display:none;">
      <div class="lab-card">
        <div class="lab-header">
          <div>
            <h2 class="lab-title">Compound Growth & Exponential Accumulation Lab</h2>
            <p class="lab-subtitle">Discrete Formula: \(A = P\left(1 + \frac{r}{n}\right)^{nt}\) | Continuous: \(A = P e^{rt}\)</p>
          </div>
          <button class="mini-btn" id="resetFinanceBtn">Reset Parameters</button>
        </div>

        <div class="lab-layout">
          <div class="lab-controls">
            <div class="control-group">
              <div class="control-label-row">
                <span>Principal (\(P\)):</span>
                <span class="control-value" id="valFinP">$5,000</span>
              </div>
              <input type="range" min="1000" max="50000" step="1000" value="5000" class="lab-slider" id="sliderFinP" />
            </div>

            <div class="control-group">
              <div class="control-label-row">
                <span>Annual Return (\(r\)):</span>
                <span class="control-value" id="valFinR">8.0%</span>
              </div>
              <input type="range" min="2" max="18" step="0.5" value="8.0" class="lab-slider" id="sliderFinR" />
            </div>

            <div class="control-group">
              <div class="control-label-row">
                <span>Time Period (\(t\)):</span>
                <span class="control-value" id="valFinT">10 Years</span>
              </div>
              <input type="range" min="1" max="30" step="1" value="10" class="lab-slider" id="sliderFinT" />
            </div>

            <div class="control-group">
              <div class="control-label-row">
                <span>Compounding (\(n\)):</span>
                <span class="control-value" id="valFinN">Monthly (12)</span>
              </div>
              <select id="selectCompounding" style="padding:6px 10px; border-radius:var(--radius-sm); border:1px solid var(--border);">
                <option value="1">Annually (n = 1)</option>
                <option value="4">Quarterly (n = 4)</option>
                <option value="12" selected>Monthly (n = 12)</option>
                <option value="365">Daily (n = 365)</option>
                <option value="inf">Continuous (e^rt)</option>
              </select>
